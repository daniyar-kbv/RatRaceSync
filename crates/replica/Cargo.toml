[package]
name = "rat-race-replica"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rat-race-engine = { path = "../engine" }
openraft = { version = "=0.10.0", features = ["serde","type-alias"] }
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
ed25519-dalek = "2"
prost = "0.14"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
